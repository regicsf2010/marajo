# 011.4 — Spatial downsample em 60 FPS.
#
# Vídeos 60 FPS feb são 1080x1920 raw (1.5x maior que 240 FPS feb 720x1280).
# Scale 0.2 → final ~213x241 (feb) vs 240 FPS final ~144x161 (feb).
# Hipótese: resolução maior introduz CPs mais ruidosos, arrastando a mediana
# pra fora do sinal.
#
# Aqui aplica scale 0.1333 (= 0.2 / 1.5) pra forçar feb 60 FPS ao mesmo tamanho
# final do feb 240 FPS. April fica menor que antes (mesma resolução raw mas
# scale menor) — limitação aceitável; o foco é isolar o efeito espacial em feb.
preprocess:
  num_frames: 600
  fps: 60
  scale: 0.1333
decomposition:
  num_pcs: 10
  variance_threshold: 0.90
cp:
  short_half_life: 1
  long_half_life: 900000
  max_mask_len: 50
  n_mask_horizon: 10
modal:
  n_peaks: 5
  peak_min_freq: 0.5
  bands:
    - [0.5, 2.0]
    - [2.0, 5.0]
    - [0.5, 5.0]
paths:
  rois_json: rois/rois.json
  out_dir: out/
  videos_root: /home/ygarasab/mestrado/tese/videos_caseiro_muda_acai
