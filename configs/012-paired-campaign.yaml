# Config do experimento 012 — validação pareada out-of-sample (3ª campanha).
#
# Design PAREADO: 2 plantas filmadas nos mesmos 14 dias, mesma câmera, mesmos
# horários (manhã 'm' + noite 'n'). _1 = controle regado, _2 = estressada (déficit).
# Mata os confounds de câmera/época do benchmark antigo (fev/G60 vs abr/Signature).
#
# Mesma análise do 010 (bandas 0.5-2, 2-5, 0.5-5 + razões), agora testando se os
# detectores validados reproduzem: tendência na planta estressada ao longo dos dias,
# estacionária no controle. Compara stressed_m vs control_m e stressed_n vs control_n.
#
# Vídeos: Motorola Signature, 240 FPS (armazenado ~30, reinterpretado pra 240), 1080p.

preprocess:
  num_frames: 800
  fps: 240
  scale: 0.2

decomposition:
  num_pcs: 10
  variance_threshold: 0.90

cp:
  short_half_life: 1
  long_half_life: 900000
  max_mask_len: 50
  n_mask_horizon: 10

modal:
  n_peaks: 5
  peak_min_freq: 0.5
  bands:
    - [0.5, 2.0]
    - [2.0, 5.0]
    - [0.5, 5.0]

paths:
  rois_json: rois/rois.json
  out_dir: out/
  videos_root: /home/ygarasab/mestrado/tese/3_camp

