# Config do experimento 011: replicar o 010 (migração de energia 0.5-5 Hz)
# nos vídeos 60 FPS em vez dos 240 FPS.
#
# Motivação: validar se os detectores consolidados (energy_0.5_2.0_median pixel,
# energy_2.0_5.0_mean phase, frac_ratio_low_over_high) sobrevivem à mudança de
# frontend de captura (60 FPS real, não slow motion). Banda 0.5-5 Hz está MUITO
# abaixo da Nyquist 30 Hz, então a queda em taxa de amostragem não deveria
# afetar o sinal. Se os detectores caem, sugere artefato do slow motion.
#
# Mesmos 16 dias canônicos do 010 (feb 07-14, apr 03-10), 4 ângulos cada,
# total 64 vídeos.
#
# num_frames=600 dá 10s de vídeo a 60 FPS (vídeos brutos têm ~639 frames). 800
# a 240 FPS dava 3.3s; aqui temos 3× mais duração, o que melhora a resolução
# em frequência (1/T = 0.1 Hz vs 0.3 Hz do 010).

preprocess:
  num_frames: 600
  fps: 60
  scale: 0.2

decomposition:
  num_pcs: 10
  variance_threshold: 0.90

cp:
  short_half_life: 1
  long_half_life: 900000
  max_mask_len: 50
  n_mask_horizon: 10

modal:
  n_peaks: 5
  peak_min_freq: 0.5
  bands:
    - [0.5, 2.0]
    - [2.0, 5.0]
    - [0.5, 5.0]

paths:
  rois_json: rois/rois.json
  out_dir: out/
  videos_root: /home/ygarasab/mestrado/tese/videos_caseiro_muda_acai/1_camp

